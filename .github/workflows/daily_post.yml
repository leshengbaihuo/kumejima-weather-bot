name: 久米島 毎朝X投稿テキスト生成

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  post-weather:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: 天気取得 → Discord投稿
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python weather_post.py
